<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetalTracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gold: #d4af37; --silver: #c0c0c0; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .header { text-align: center; padding: 20px 0; }
        .toggle-container { text-align: center; margin-bottom: 20px; }
        .btn-group { display: inline-flex; background: var(--card); border-radius: 10px; padding: 5px; }
        .btn { padding: 8px 15px; border: none; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; }
        .btn.active { background: #334155; font-weight: bold; }
        
        .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .price-card { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; border-bottom: 4px solid transparent; }
        .gold-border { border-color: var(--gold); }
        .silver-border { border-color: var(--silver); }
        .price-value { font-size: 1.4rem; font-weight: bold; margin: 10px 0; }
        .label { font-size: 0.8rem; opacity: 0.7; text-transform: uppercase; }

        .chart-container { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        canvas { width: 100% !important; height: 200px !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1>MetalTracker</h1>
    </div>

    <div class="toggle-container">
        <div class="btn-group">
            <button class="btn active" onclick="setCurrency('INR', this)">INR</button>
            <button class="btn" onclick="setCurrency('USD', this)">USD</button>
        </div>
    </div>

    <div class="price-grid">
        <div class="price-card gold-border">
            <div class="label">24K Gold (10g)</div>
            <div id="goldPrice" class="price-value">Loading...</div>
        </div>
        <div class="price-card silver-border">
            <div class="label">Silver (1kg)</div>
            <div id="silverPrice" class="price-value">Loading...</div>
        </div>
    </div>

    <div class="chart-container">
        <div class="label" style="margin-bottom:10px;">Gold Trend (30 Days)</div>
        <canvas id="goldChart"></canvas>
    </div>

    <div class="chart-container">
        <div class="label" style="margin-bottom:10px;">Silver Trend (30 Days)</div>
        <canvas id="silverChart"></canvas>
    </div>

    <script>
        let currentCurrency = 'INR';
        const exchangeRate = 83.50; // Manual fallback or fetch from ExchangeRate-API
        
        // Conversion Math
        // Gold: (Price per oz / 31.1035) * 10
        // Silver: (Price per oz / 31.1035) * 1000

        async function fetchData() {
            // Placeholder: Replace 'YOUR_API_KEY' with your actual GoldAPI.io key
            const apiKey = 'goldapi-14iiv4smo37d402-io'; 
            const headers = { "x-access-token": apiKey, "Content-Type": "application/json" };

            try {
                // In a real scenario, you'd fetch from GoldAPI.io
                // Fetching static demo data for now to show the UI
                updateUI(2350.50, 28.40); // Sample USD prices per ounce
                renderCharts();
            } catch (e) {
                console.error("Fetch failed", e);
            }
        }

        function updateUI(goldOz, silverOz) {
            let g10 = (goldOz / 31.1035) * 10;
            let s1k = (silverOz / 31.1035) * 1000;

            if (currentCurrency === 'INR') {
                g10 *= exchangeRate;
                s1k *= exchangeRate;
            }

            const symbol = currentCurrency === 'INR' ? '₹' : '$';
            document.getElementById('goldPrice').innerText = `${symbol}${g10.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
            document.getElementById('silverPrice').innerText = `${symbol}${s1k.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
        }

        function setCurrency(curr, el) {
            currentCurrency = curr;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            fetchData();
        }

        function renderCharts() {
            const ctxG = document.getElementById('goldChart').getContext('2d');
            const ctxS = document.getElementById('silverChart').getContext('2d');
            
            const commonOptions = {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { grid: { color: '#334155' } } }
            };

            new Chart(ctxG, {
                type: 'line',
                data: {
                    labels: Array(30).fill(''),
                    datasets: [{ data: [2300, 2310, 2305, 2340, 2350], borderColor: '#d4af37', tension: 0.4 }]
                },
                options: commonOptions
            });

            new Chart(ctxS, {
                type: 'line',
                data: {
                    labels: Array(30).fill(''),
                    datasets: [{ data: [27, 28, 27.5, 28.2, 28.4], borderColor: '#c0c0c0', tension: 0.4 }]
                },
                options: commonOptions
            });
        }

        fetchData();
    </script>
</body>
</html>
