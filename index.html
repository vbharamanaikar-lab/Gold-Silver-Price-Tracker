<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold & Silver Tracker - India</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ivory:#faf7f2;--cream:#f3ede3;--gold:#b8862a;--gold-bg:#fdf4e0;
  --silver:#5f6b7a;--ink:#1e1a14;--ink-soft:#9a8f82;--border:#ddd4c6;
  --red:#c0392b;--green:#2e7d52;--warning:#f39c12;--warning-bg:#fef5e7;
  --shadow:0 4px 16px rgba(80,60,20,0.10);--font-h:'Lora',serif;--font-b:'DM Sans',sans-serif;
}
body{font-family:var(--font-b);background:var(--ivory);color:var(--ink);min-height:100vh}
.header{background:white;border-bottom:1px solid var(--border);padding:12px 18px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.header h1{font-family:var(--font-h);font-size:1rem;font-weight:700;color:var(--ink)}
.header h1 em{font-style:normal;color:var(--gold)}
.city-strip{display:flex;justify-content:center;gap:8px;background:white;padding:12px;border-bottom:1px solid var(--border)}
.city-btn{padding:8px 16px;border:1px solid var(--border);background:white;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:500;transition:all 0.2s}
.city-btn:hover{background:var(--cream)}
.city-btn.active{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);font-weight:600}
.main{max-width:640px;margin:20px auto;padding:0 16px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.price-card{background:white;border-radius:12px;padding:16px;box-shadow:var(--shadow);border-bottom:3px solid var(--gold)}
.price-card.silver{border-bottom-color:var(--silver)}
.price-label{font-size:0.7rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.price-value{font-family:var(--font-h);font-size:1.4rem;font-weight:700;margin-bottom:6px}
.price-card.gold .price-value{color:var(--gold)}
.price-card.silver .price-value{color:var(--silver)}
.price-change{font-size:0.7rem;font-weight:500}
.up{color:var(--green)} .down{color:var(--red)}
.chart-panel{background:white;border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:20px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--cream)}
.chart-title{font-size:0.85rem;font-weight:600;color:var(--ink-soft)}
.chart-period{background:var(--cream);padding:4px 12px;border-radius:6px;font-size:0.65rem;font-weight:600;color:var(--ink-soft)}
.chart-container{height:220px;position:relative}
.status-msg{text-align:center;font-size:0.8rem;color:var(--ink-soft);margin-bottom: 20px;}
@media(max-width:640px){
  .city-strip{flex-wrap:wrap;gap:6px}
  .city-btn{padding:6px 12px;font-size:0.75rem}
}
</style>
</head>
<body>

<div class="header">
  <h1>Gold &amp; <em>Silver</em> Price Tracker - India</h1>
</div>

<div class="city-strip">
  <button class="city-btn active" onclick="setCity(0)">Mumbai</button>
  <button class="city-btn" onclick="setCity(1)">Delhi</button>
  <button class="city-btn" onclick="setCity(2)">Kolkata</button>
  <button class="city-btn" onclick="setCity(3)">Chennai</button>
</div>

<div class="main">
  <div id="statusMessage" class="status-msg">Loading latest data...</div>

  <div class="prices">
    <div class="price-card gold">
      <div class="price-label">Gold (10g 24K)</div>
      <div class="price-value" id="goldPrice">—</div>
      <div class="price-change" id="goldChange">—</div>
    </div>
    <div class="price-card silver">
      <div class="price-label">Silver (1kg)</div>
      <div class="price-value" id="silverPrice">—</div>
      <div class="price-change" id="silverChange">—</div>
    </div>
  </div>

  <div class="chart-panel">
    <div class="chart-header">
      <div class="chart-title">Gold Trend (₹/10g)</div>
      <div class="chart-period">DYNAMIC</div>
    </div>
    <div class="chart-container">
      <canvas id="goldChart"></canvas>
    </div>
  </div>

  <div class="chart-panel">
    <div class="chart-header">
      <div class="chart-title">Silver Trend (₹/kg)</div>
      <div class="chart-period">DYNAMIC</div>
    </div>
    <div class="chart-container">
      <canvas id="silverChart"></canvas>
    </div>
  </div>
</div>

<script>
'use strict';

const CITIES = [
  {name:'Mumbai',gMul:1,sMul:1},
  {name:'Delhi',gMul:1.0018,sMul:1.001},
  {name:'Kolkata',gMul:1.003,sMul:1.0015},
  {name:'Chennai',gMul:1.0052,sMul:1.0025}
];

let activeCity = 0;
let goldChart, silverChart;
let globalData = null; // Will store the fetched API data

// --- 1. DATA FETCHING & CACHING LOGIC ---

async function fetchAndCacheData() {
  const today = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
  const cachedDate = localStorage.getItem('ibja_last_fetch');
  
  if (cachedDate === today) {
    // If we already fetched today, load from localStorage to save network calls
    document.getElementById('statusMessage').textContent = "Loaded from local cache (Updated today)";
    return JSON.parse(localStorage.getItem('ibja_data'));
  }

  try {
    document.getElementById('statusMessage').textContent = "Fetching live data from API...";
    
    // REPLACE THIS URL WITH YOUR ACTUAL BACKEND OR API ENDPOINT
    const API_URL = 'https://your-api-endpoint.com/bullion-data'; 
    
    // const response = await fetch(API_URL);
    // const data = await response.json();
    
    // --- MOCK API RESPONSE --- 
    // Since there is no free public IBJA API, this simulates what the endpoint should return
    const data = simulateAPIResponse();
    // -------------------------

    // Save to local storage so we only fetch once per day
    localStorage.setItem('ibja_last_fetch', today);
    localStorage.setItem('ibja_data', JSON.stringify(data));
    
    document.getElementById('statusMessage').textContent = "Live data successfully updated!";
    return data;
  } catch (error) {
    document.getElementById('statusMessage').textContent = "Failed to load data. Please try again later.";
    console.error("API Fetch Error:", error);
    return null;
  }
}

// --- 2. UI & CHART RENDERING LOGIC ---

function updatePrices() {
  if (!globalData) return;
  const city = CITIES[activeCity];
  
  // Get latest day's prices
  const latestGold = globalData.gold[globalData.gold.length - 1] * city.gMul;
  const latestSilver = globalData.silver[globalData.silver.length - 1] * city.sMul;

  document.getElementById('goldPrice').textContent = '₹' + Math.round(latestGold).toLocaleString('en-IN');
  document.getElementById('silverPrice').textContent = '₹' + Math.round(latestSilver).toLocaleString('en-IN');
}

function drawChart(canvasId, dataPoints, labels, color, isGold) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 220);
  grad.addColorStop(0, color + '30');
  grad.addColorStop(1, color + '00');
  
  const cityMul = isGold ? CITIES[activeCity].gMul : CITIES[activeCity].sMul;
  const prices = dataPoints.map(p => Math.round(p * cityMul));
  
  const chart = isGold ? goldChart : silverChart;
  if (chart) chart.destroy();
  
  const newChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        data: prices,
        borderColor: color,
        backgroundColor: grad,
        borderWidth: 2,
        fill: true,
        tension: 0.1,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointBackgroundColor: color,
        pointBorderColor: 'white'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {mode: 'index', intersect: false},
      plugins: {
        legend: {display: false},
        tooltip: {
          callbacks: {
            label: c => ' ₹' + c.raw.toLocaleString('en-IN')
          }
        }
      },
      scales: {
        x: { grid: { display: false } },
        y: { position: 'right' }
      }
    }
  });
  
  if (isGold) goldChart = newChart; else silverChart = newChart;
  
  // Calculate Change
  const diff = prices[prices.length - 1] - prices[0];
  const pct = ((diff / prices[0]) * 100).toFixed(2);
  const changeEl = document.getElementById(isGold ? 'goldChange' : 'silverChange');
  changeEl.textContent = `${diff >= 0 ? '▲' : '▼'} ₹${Math.abs(Math.round(diff)).toLocaleString('en-IN')} (${Math.abs(pct)}%)`;
  changeEl.className = 'price-change ' + (diff >= 0 ? 'up' : 'down');
}

async function initDashboard() {
  globalData = await fetchAndCacheData();
  if (globalData) {
    updateUI();
  }
}

function updateUI() {
  updatePrices();
  drawChart('goldChart', globalData.gold, globalData.labels, '#b8862a', true);
  drawChart('silverChart', globalData.silver, globalData.labels, '#5f6b7a', false);
}

function setCity(index) {
  activeCity = index;
  document.querySelectorAll('.city-btn').forEach((btn, i) => {
    btn.className = i === index ? 'city-btn active' : 'city-btn';
  });
  updateUI();
}

// --- 3. MOCK API HELPER (REMOVE WHEN USING REAL ENDPOINT) ---
function simulateAPIResponse() {
  const labels = [];
  const gold = [];
  const silver = [];
  let currentGold = 72000;
  let currentSilver = 85000;
  
  // Generate 30 days of dummy historical data
  for (let i = 30; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    labels.push(d.toLocaleDateString('en-IN', {month:'short', day:'numeric'}));
    
    currentGold += (Math.random() - 0.4) * 500;
    currentSilver += (Math.random() - 0.4) * 800;
    gold.push(currentGold);
    silver.push(currentSilver);
  }
  return { labels, gold, silver };
}

// Initialize the app on load
initDashboard();
</script>

</body>
</html>
